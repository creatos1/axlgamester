<section>
  <app-nav></app-nav>
  <div class="usuario-container">
    <h1>Perfil de Usuario</h1>
  </div>
  <div class="usuario-dropdown">
    <img src="../../assets/img/5.gif" alt="Usuario" class="usuario-icon" />
    <p>Usuario: "{{ email }}"</p>
    <button (click)="logout()" class="btn-logout">Cerrar Sesión</button>
    <button *ngIf="isAdmin" (click)="goToAdmin()" class="btn-admin">Panel de Control</button>
    <button (click)="deleteOwnAccount()" class="btn-delete">Eliminar mi cuenta</button>
  </div>
</section>
<app-footer></app-footer>
