
<div class="modal-overlay" *ngIf="isVisible" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>¡Bienvenido!</h2>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>
    
    <div class="modal-body">
      <div class="success-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      
      <h3>Registro completado con éxito</h3>
      
      <p>Tu cuenta ha sido creada exitosamente:</p>
      <p class="email-highlight">{{ userEmail }}</p>
      
      <p>¡Ya puedes empezar a usar tu cuenta! Serás redirigido al inicio en unos momentos.</p>
      
      <div class="spam-warning">
        <i class="fas fa-info-circle"></i>
        <p>Hemos enviado un correo de bienvenida a tu dirección. <strong>Revisa tu bandeja de entrada o carpeta de SPAM</strong> si no lo ves.</p>
      </div>
      
      <div class="modal-actions">
        <button class="continue-btn" (click)="close()">
          Ir a Iniciar Sesión
        </button>
      </div>
    </div>
  </div>
</div>
